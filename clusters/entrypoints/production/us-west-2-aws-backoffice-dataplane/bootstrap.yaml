apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-vars
  namespace: flux-system
data:
  # vault
  OP_VAULT: MyIndexer
  OP_VAULT_CLUSTER_ZONE: production/cluster-zone
  OP_VAULT_TXT_OWNER_ID: production/txt-owner-id
  OP_VAULT_ACME_EMAIL: production/acme-email
  OP_VAULT_ALERT_EMAIL_TO: production/alert-email-to
  OP_VAULT_CLOUDFLARE_TOKEN: production/cloudflare-api-token
  OP_VAULT_GRAFANA_ADMIN_USER: production/grafana-admin-username
  OP_VAULT_GRAFANA_ADMIN_PASSWORD: production/grafana-admin-password
  OP_VAULT_GRAFANA_SMTP_HOST: production/grafana-smtp-host
  OP_VAULT_GRAFANA_SMTP_USER: production/grafana-smtp-user
  OP_VAULT_GRAFANA_SMTP_FROM_ADDRESS: production/grafana-smtp-from-address
  OP_VAULT_RESEND_SMTP_PASSWORD: production/resend-smtp-password

  # common
  PLATFORM_SOURCE: flux-system
  PLATFORM_PATH_PREFIX: ./clusters/packages/layer-zero
  PLATFORM_NAMESPACE: platform-system
  ACME_ENV: production # staging | production
  GRAFANA_ALLOWED_CIDRS: '["0.0.0.0/0"]'
  GATEWAY_LB_SOURCE_RANGES: '["0.0.0.0/0"]'
  FLUX_INTERVAL: 5m0s
  FLUX_RETRY_INTERVAL: 1m0s
  FLUX_TIMEOUT: 5m0s
  ENVOY_REPLICAS: "3"
  SHIM_REPLICAS: "3"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 1m0s
  timeout: 5m0s
  path: ./clusters/packages/layer-zero/platform/bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
