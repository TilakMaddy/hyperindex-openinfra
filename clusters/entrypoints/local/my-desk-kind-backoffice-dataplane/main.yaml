apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  # vault
  OP_VAULT_INDEXER_IMAGE_NAME: local/indexer-image-name
  OP_VAULT_ENVIO_TOKEN: local/envio-token
  OP_VAULT_CHAIN_INDEXER_PG_PASSWORD: local/chain-indexer-pg-password
  OP_VAULT_CHAIN_INDEXER_PG_SUPERUSER_PASSWORD: local/chain-indexer-pg-superuser-password
  OP_VAULT_CHAIN_INDEXER_HASURA_ADMIN_SECRET: local/chain-indexer-hasura-admin-secret
  OP_VAULT_PG_BACKUP_DESTINATION: local/pg-backup-destination
  OP_VAULT_PG_BACKUP_REGION: local/pg-backup-region

  # common
  PLATFORM_NAMESPACE: platform-system
  FLUX_INTERVAL: 30s
  FLUX_RETRY_INTERVAL: 15s
  FLUX_TIMEOUT: 1m0s
  PG_INSTANCES: "3"
  PG_POOLER_INSTANCES: "3"
  PG_STORAGE: 1Gi
  PG_WAL_STORAGE: 1Gi
  PG_BACKUPS_ENABLED: "false"
  INDEXER_IMAGE_PULL_POLICY: IfNotPresent
  INDEXER_KEEL_POLICY: never
  INDEXER_KEEL_TRIGGER: poll
  INDEXER_KEEL_POLL_INTERVAL: 1h

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 1m0s
  path: ./clusters/common
  prune: true
  wait: true
  dependsOn:
    - name: bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 1m0s
  path: ./clusters/apps
  prune: true
  wait: true
  dependsOn:
    - name: common
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: ConfigMap
        name: chain-indexer-vars
      - kind: Secret
        name: platform-secret-vars
      - kind: Secret
        name: cluster-secret-vars
