#   ref:
#     branch: dev
#   secretRef:
#     name: flux-system
#   recurseSubmodules: true
#   url: https://github.com/TilakMaddy/hyperindex-openinfra.git

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 1m0s
  path: ./clusters/packages/layer-zero/platform/bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
