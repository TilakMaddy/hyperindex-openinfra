apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-vars
  namespace: flux-system
data:
  # vault
  OP_VAULT: MyIndexer
  OP_VAULT_CLUSTER_ZONE: local/cluster-zone
  OP_VAULT_GATEWAY_LB_SOURCE_RANGES: local/gateway-lb-source-ranges
  OP_VAULT_TXT_OWNER_ID: local/txt-owner-id
  OP_VAULT_ACME_EMAIL: local/acme-email
  OP_VAULT_ALERT_EMAIL_TO: local/alert-email-to
  OP_VAULT_CLOUDFLARE_TOKEN: local/cloudflare-api-token
  OP_VAULT_GRAFANA_ADMIN_USER: local/grafana-admin-username
  OP_VAULT_GRAFANA_ADMIN_PASSWORD: local/grafana-admin-password
  OP_VAULT_GRAFANA_SMTP_HOST: local/grafana-smtp-host
  OP_VAULT_GRAFANA_SMTP_USER: local/grafana-smtp-user
  OP_VAULT_GRAFANA_SMTP_FROM_ADDRESS: local/grafana-smtp-from-address
  OP_VAULT_RESEND_SMTP_PASSWORD: local/resend-smtp-password

  # common
  PLATFORM_SOURCE: flux-system
  PLATFORM_PATH_PREFIX: ./clusters/packages/layer-zero
  PLATFORM_NAMESPACE: platform-system
  ACME_ENV: staging # staging | production
  GRAFANA_ALLOWED_CIDRS: '["0.0.0.0/0"]'
  FLUX_INTERVAL: 30s
  FLUX_RETRY_INTERVAL: 15s
  FLUX_TIMEOUT: 1m0s
  ENVOY_REPLICAS: "3"
  SHIM_REPLICAS: "3"

# ---
# apiVersion: source.toolkit.fluxcd.io/v1
# kind: GitRepository
# metadata:
#   name: platform-foundation
