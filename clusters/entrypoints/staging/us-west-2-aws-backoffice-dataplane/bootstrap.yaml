apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-vars
  namespace: flux-system
data:
  # vault
  OP_VAULT: MyIndexer
  OP_VAULT_CLUSTER_ZONE: staging/cluster-zone
  OP_VAULT_GATEWAY_LB_SOURCE_RANGES: staging/gateway-lb-source-ranges
  OP_VAULT_TXT_OWNER_ID: staging/txt-owner-id
  OP_VAULT_ACME_EMAIL: staging/acme-email
  OP_VAULT_ALERT_EMAIL_TO: staging/alert-email-to
  OP_VAULT_CLOUDFLARE_TOKEN: staging/cloudflare-api-token
  OP_VAULT_GRAFANA_ADMIN_USER: staging/grafana-admin-username
  OP_VAULT_GRAFANA_ADMIN_PASSWORD: staging/grafana-admin-password
  OP_VAULT_GRAFANA_SMTP_HOST: staging/grafana-smtp-host
  OP_VAULT_GRAFANA_SMTP_USER: staging/grafana-smtp-user
  OP_VAULT_GRAFANA_SMTP_FROM_ADDRESS: staging/grafana-smtp-from-address
  OP_VAULT_RESEND_SMTP_PASSWORD: staging/resend-smtp-password

  # common
  PLATFORM_SOURCE: flux-system
  PLATFORM_PATH_PREFIX: ./clusters/packages/layer-zero
  PLATFORM_NAMESPACE: platform-system
  ACME_ENV: staging # staging | production
  FLUX_INTERVAL: 2m0s
  FLUX_RETRY_INTERVAL: 30s
  FLUX_TIMEOUT: 3m0s
  ENVOY_REPLICAS: "3"
  SHIM_REPLICAS: "3"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: flux-system
spec:
  interval: 2m0s
  retryInterval: 30s
  timeout: 3m0s
  path: ./clusters/packages/layer-zero/platform/bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
