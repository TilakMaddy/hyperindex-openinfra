apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: chain-indexer-overview
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  folderRef: ${APP_CHAIN_INDEXER_GRAFANA_FOLDER}
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  resyncPeriod: 5m
  json: |
      {
        "uid": "chain-indexer-overview",
        "title": "Chain Indexer Overview",
        "description": "Metrics and logs for the Envio indexer, Hasura and the CloudNativePG cluster backing them.",
        "tags": [
          "chain-indexer"
        ],
        "editable": true,
        "schemaVersion": 39,
        "version": 1,
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "timezone": "browser",
        "timepicker": {},
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Indexer",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            },
            "panels": []
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Sync state",
            "description": "envio_progress_ready: 1 when the chain is fully synced to head. Minimum across chains.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "min(envio_progress_ready{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "SYNCING",
                        "color": "orange",
                        "index": 1
                      },
                      "1": {
                        "text": "SYNCED",
                        "color": "green",
                        "index": 0
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Restarts",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 4,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\",container=\"${APP_CHAIN_INDEXER_SVC}\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 1
                    },
                    {
                      "color": "red",
                      "value": 5
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 30,
            "type": "stat",
            "title": "Total events",
            "description": "Cumulative events processed and reflected in the database.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(envio_progress_events{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "none",
              "graphMode": "area",
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 4,
            "type": "timeseries",
            "title": "Blocks behind head",
            "description": "known_height - progress_block. The single best indicator that the indexer is falling behind.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 1,
              "w": 6,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_indexing_known_height{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"} - envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "chain {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "last",
                  "max"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 5,
            "type": "timeseries",
            "title": "Write latency",
            "description": "Milliseconds between event creation on chain and the write landing in Postgres.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 18,
              "y": 1,
              "w": 6,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_progress_latency{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "chain {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "mean",
                  "max"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 6,
            "type": "timeseries",
            "title": "Block height",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 5,
              "w": 8,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "processed {{chainId}}"
              },
              {
                "refId": "B",
                "expr": "envio_indexing_known_height{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "head {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "last"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 7,
            "type": "timeseries",
            "title": "Events/sec",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 5,
              "w": 8,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "rate(envio_progress_events{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "chain {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 8,
            "type": "timeseries",
            "title": "CPU / memory",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 16,
              "y": 5,
              "w": 8,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\",container=\"${APP_CHAIN_INDEXER_SVC}\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "cpu cores"
              },
              {
                "refId": "B",
                "expr": "sum(container_memory_working_set_bytes{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\",container=\"${APP_CHAIN_INDEXER_SVC}\"}) / 1024 / 1024 / 1024",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "memory GiB"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "last",
                  "max"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 9,
            "type": "timeseries",
            "title": "Reorgs & rollbacks",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 10,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "increase(envio_reorg_detected_total{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[1h]) or vector(0)",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "reorgs/h {{chainId}}"
              },
              {
                "refId": "B",
                "expr": "increase(envio_rollback_total{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[1h]) or vector(0)",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "rollbacks/h {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 10,
            "type": "logs",
            "title": "Indexer logs",
            "description": "",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "x": 8,
              "y": 10,
              "w": 16,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", app=\"${APP_CHAIN_INDEXER_SVC}\"}",
                "queryType": "range"
              }
            ],
            "options": {
              "showTime": true,
              "showLabels": false,
              "wrapLogMessage": true,
              "prettifyLogMessage": false,
              "sortOrder": "Descending",
              "enableLogDetails": true,
              "dedupStrategy": "none"
            }
          },
          {
            "id": 11,
            "type": "row",
            "title": "Hasura",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 16,
              "w": 24,
              "h": 1
            },
            "panels": []
          },
          {
            "id": 12,
            "type": "timeseries",
            "title": "Requests/sec",
            "description": "Measured at the Envoy Gateway; Hasura CE exposes no Prometheus endpoint.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 17,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~\"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "rps"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "mean",
                  "max"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 13,
            "type": "timeseries",
            "title": "Responses by class",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 17,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (envoy_response_code_class) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "{{envoy_response_code_class}}xx"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "normal",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 14,
            "type": "timeseries",
            "title": "Upstream latency",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 16,
              "y": 17,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "histogram_quantile(0.50, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~\"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*\"}[5m])))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "p50"
              },
              {
                "refId": "B",
                "expr": "histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~\"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*\"}[5m])))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "p95"
              },
              {
                "refId": "C",
                "expr": "histogram_quantile(0.99, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~\"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*\"}[5m])))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "legendFormat": "p99"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 15,
            "type": "stat",
            "title": "Replicas available",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 23,
              "w": 4,
              "h": 7
            },
            "targets": [
              {
                "refId": "A",
                "expr": "kube_deployment_status_replicas_available{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\",deployment=\"${APP_CHAIN_INDEXER_HASURA_SVC}\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "format": "time_series",
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 1
                    },
                    {
                      "color": "green",
                      "value": 2
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 16,
            "type": "logs",
            "title": "Hasura logs",
            "description": "",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "x": 4,
              "y": 23,
              "w": 20,
              "h": 7
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", app=\"${APP_CHAIN_INDEXER_HASURA_SVC}\"}",
                "queryType": "range"
              }
            ],
            "options": {
              "showTime": true,
              "showLabels": false,
              "wrapLogMessage": true,
              "prettifyLogMessage": false,
              "sortOrder": "Descending",
              "enableLogDetails": true,
              "dedupStrategy": "none"
            }
          },
          {
            "id": 17,
            "type": "row",
            "title": "Postgres",
            "collapsed": false,
